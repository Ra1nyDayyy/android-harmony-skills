interface:
  display_name: "安卓迁移总管"
  short_description: "一次指令连续执行安卓盘点、鸿蒙基座、功能迁移与四阶段门禁"
  default_prompt: "使用 $android-harmony-migration-controller 对当前 Android 项目连续执行 Phase 1–4。自动发现可确定的项目、APK 和环境信息，Phase 3 使用 Skill 内置 ArkUI 模板；每个 Gate 通过后直接进入下一阶段，不要等待我回复继续。遇到可修复问题自动返工和复验，只有外部凭据、工具链或模拟器确实缺失时才暂停并一次列全阻塞项。"
policy:
  allow_implicit_invocation: true
