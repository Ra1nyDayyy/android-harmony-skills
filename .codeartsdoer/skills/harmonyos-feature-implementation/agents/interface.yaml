interface:
  display_name: "HarmonyOS Feature Implementation"
  short_description: "Implement and prove Android-to-ArkUI parity"
  default_prompt: "Use $harmonyos-feature-implementation after approved Gate 3 to implement one PAGE_WORK_ORDER per Page-ID, verify one final HAP, and stop at WAITING_HUMAN_REVIEW."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "claude", "agent-skills", "vscode", "generic"]
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "native-skill-metadata"
    claude: "neutral-source-plus-adapter"
    vscode: "agent-skills-source-with-workspace-trust"
    agent-skills: "neutral-source"
    generic: "neutral-source"
