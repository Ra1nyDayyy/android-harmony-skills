interface:
  display_name: "Android Migration Inventory"
  short_description: "Discover Android pages, states, behavior, and evidence"
  default_prompt: "Use $android-migration-inventory after Gate 1 to build and deterministically close the Phase 2 semantic inventory."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "claude", "agent-skills", "vscode", "generic"]
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "native-skill-metadata"
    claude: "neutral-source-plus-adapter"
    vscode: "agent-skills-source-with-workspace-trust"
    agent-skills: "neutral-source"
    generic: "neutral-source"
